
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 07 - Mini Chat</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="container py-5">

    <h1 class="mb-2">Mini Chat</h1>
    <p class="text-muted">Send a message and chat with others.</p>

    <div
        id="chatBox"
        class="border rounded p-3 mb-3"
        style="height: 300px; overflow-y: auto;"
        aria-live="polite"
    ></div>

    <form id="chatForm">
        <div class="mb-3">
            <label for="sender" class="form-label">Name</label>
            <input
                type="text"
                id="sender"
                name="sender"
                class="form-control"
                placeholder="Enter your name"
                maxlength="100"
                required
            >
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea
                id="message"
                name="message"
                class="form-control"
                placeholder="Write your message"
                rows="3"
                maxlength="2000"
                required
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Send Message
        </button>
    </form>


    <script src="task07.js"></script>
</body>
</html>
