<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 06 - Add or Update Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .valid { color: green; }
        .error { color: red; }
    </style>
</head>
<body class="container mt-5">
    <h2>Task 06 - Add or Update Product</h2>

    <form id="productForm">
        <div class="mb-3">
            <label for="typeInput" class="form-label">Type:</label>
            <input type="text" id="typeInput" name="type" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="brandInput" class="form-label">Brand:</label>
            <input type="text" id="brandInput" name="brand" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="priceInput" class="form-label">Price:</label>
            <input type="number" id="priceInput" name="price" class="form-control" min="0" step="any" required>
        </div>

        <div class="mb-3">
            <label for="numberInput" class="form-label">Number / Stock:</label>
            <input type="number" id="numberInput" name="number" class="form-control" min="0" step="1" required>
        </div>

        <button type="submit" class="btn btn-primary">Save Product</button>
    </form>

    <div id="responseMsg" class="mt-3 fw-bold"></div>

    <script src="task06.js"></script>
</body>
</html>
